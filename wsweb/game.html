<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldSim · 文字游戏</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--ink:#c9d1d9;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;--gold:#e3b341;border-radius:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono","Noto Sans SC",monospace,system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid #30363d;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;color:var(--acc)}
header .spacer{flex:1}
button{background:#21262d;color:var(--ink);border:1px solid #30363d;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.5;cursor:not-allowed}
#panel{display:flex;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid #30363d;flex-wrap:wrap;font-size:13px;align-items:center}
.chip{background:#0d1117;border:1px solid #30363d;border-radius:14px;padding:3px 10px}
.chip b{color:var(--acc)}
.hpwrap{width:140px;height:10px;background:#21262d;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
#hpbar{height:100%;background:linear-gradient(90deg,#f85149,#3fb950);width:100%;transition:width .3s}
main{flex:1;overflow-y:auto;padding:18px 16px 8px;max-width:900px;width:100%;margin:0 auto}
.turn{padding:6px 12px;border-left:2px solid var(--acc);margin-bottom:14px}
.turn .who{color:var(--dim);font-size:12px;margin-bottom:2px}
.turn.you{border-left-color:#a371f7}
.turn.you .who{color:#a371f7}
.turn .dice{font-size:12px;color:var(--dim)}
.dice.ok{color:var(--ok)} .dice.fail{color:var(--bad)}
.narration{line-height:1.75;white-space:pre-wrap}
footer{padding:12px 16px;background:var(--panel);border-top:1px solid #30363d;max-width:932px;width:100%;margin:0 auto}
.modes{display:flex;gap:8px;margin-bottom:8px}
.modes button.active{border-color:var(--acc);color:var(--acc);background:#0d2136}
.inputrow{display:flex;gap:8px}
#input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:var(--ink);padding:10px 12px;font:inherit;outline:none}
#input:focus{border-color:var(--acc)}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
#busy{color:var(--acc);font-size:12px;display:none}
.modal{position:fixed;inset:0;background:rgba(1,4,9,.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.modal.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>⌨ WorldSim · 文字游戏</h1>
  <span class="chip" id="worldChip">世界：—</span>
  <span class="spacer"></span>
  <button id="btnStart">▶ 开始 / 重开</button>
  <button id="btnStop">■ 结束</button>
  <a href="/" style="color:var(--dim);font-size:13px">← 控制台</a>
</header>
<div id="panel">
  <span class="chip">LV <b id="lv">1</b></span>
  <span class="chip">HP <span class="hpwrap"><span id="hpbar"></span></span> <b id="hp">100/100</b></span>
  <span class="chip">💰 <b id="gold">0</b></span>
  <span class="chip">⭐XP <b id="xp">0</b>/100</span>
  <span class="chip">📍 <b id="loc">—</b></span>
  <span class="chip">🎯 <b id="quest">—</b></span>
  <span class="chip">🎒 <b id="inv">—</b></span>
</div>
<div style="padding:0 16px 6px;max-width:932px;margin:0 auto;display:flex;align-items:flex-end;gap:10px"><img id="heroSprite" src="" style="height:64px;image-rendering:pixelated;display:none" alt=""><div id="attrs"
<div id="attrs" style="padding:0 16px 6px;max-width:932px;margin:0 auto;font-size:12px;color:var(--dim);max-height:60px;overflow-y:auto"></div>
<main id="log"></main>
<footer>
  <div class="modes">
    <button class="modebtn active" data-m="do" title="第三人称行动描述">▸ 行动 do</button>
    <button class="modebtn" data-m="say" title="第一人称说话（引号内内容直接出声）">💬 说话 say</button>
    <button class="modebtn" data-m="story" title="以世界意志推进剧情（作者模式）">✍ 叙事 story</button>
    <button id="btnWait" class="hint">⏳ 等待（世界自转+休息回血）</button>
  </div>
  <div class="inputrow">
    <input id="input" placeholder="输入你要做的事，回车提交（掷骰由代码完成——命运在骰子上）…">
    <button id="btnSend">⏎</button>
  </div>
  <div class="hint" id="busy">裁决中……（骰子+叙述需要两次 LLM 调用）</div>
</footer>
<div class="modal hidden" id="modal"><div id="modalMsg" style="color:var(--acc)">正在开局……</div></div>

<script>
const $=s=>document.querySelector(s);const main=document.getElementById('log');let mode='do';const api=p=>fetch(p,{headers:{'Content-Type':'application/json'}});
const post=(p,extra)=>api(p+'.',{method:'POST',body:JSON.stringify(Object.assign({input:document.getElementById('input').value,mode},extra||{}))}).then(r=>r.json());

function renderState(st){
  if(!st)return;
  document.getElementById('lv').textContent=st.level;
  document.getElementById('hp').textContent=st.hp+'/'+st.max_hp;
  document.getElementById('hpbar').style.width=(100*st.hp/st.max_hp)+'%';
  document.getElementById('gold').textContent=st.gold;
  document.getElementById('xp').textContent=st.xp;
  document.getElementById('loc').textContent=st.location||'—';
  document.getElementById('quest').textContent=st.quest||'—';
  document.getElementById('inv').textContent=(st.inventory||[]).length?st.inventory.slice(0,4).join('、')+(st.inventory.length>4?'…':''):'（空）';
  const at=document.getElementById('attrs');at.textContent='';
  if(st.attrs)for(const[k,v]of Object.entries(st.attrs)){
    at.insertAdjacentHTML('beforeend',`<span class="chip">${k} <b>${v}</b>/10</span> `);
  }
}
function addTurn(t){
  const div=document.createElement('div');div.className='turn'+(t.you?' you':'');
  div.innerHTML=`<div class="who">${t.who}</div><div class="narration">${t.text.replace(/</g,'&lt;')}</div>`;
  if(t.check){const c=t.check,ok=c.success;
    div.insertAdjacentHTML('beforeend',`<div class="dice ${ok?'ok':'fail'}">🎲 检定[${c.ability}]: d20=${c.roll}${(c.mod>=0?'+':'')+c.mod} vs 难度${c.dc} → ${ok?'成功':'失败'}</div>`);
    if(!ok)applyMonsterOnFail();}
  main.appendChild(div);main.scrollTop=main.scrollHeight;
}
function pushYou(txt,m){addTurn({you:1,who:`你 (${mName(m)}) →`,text:txt});}
function pushAI(txt,chk){addTurn({who:'世界 →',text:txt,check:chk});}
const mName=m=>({do:'行动',say:'说话',story:'叙事'})[m]||'行动';

async function refresh(){try{const r=await(api('/api/game/status').then(x=>x.json()));
  if(r.error||!r.game)return;
  applyPixelArt(r);
  document.getElementById('worldChip').textContent='世界：'+(r.day!=null?'':'' ); 
  renderState(r.game);
  if(!r.game.log)return;
  main.innerHTML='';
  for(const e of r.game.log){
    if(e.mode==='start'){addTurn({who:'开场 →',text:e.narration});}
    else{pushYou(e.input,e.mode);pushAI(e.narration,e.check);renderState(r.game);}
  }
}catch(e){}}
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll('.modebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
document.getElementById('btnSend').onclick=send;
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
async function send(){
  const inp=document.getElementById('input');const txt=inp.value.trim();if(!txt)return;inp.value='';
  pushYou(txt,mode);setBusy(true);
  try{const r=await post('/api/game/action');if(r.ok){
    const last=((r.state||{}).log||[]).slice(-1)[0];
    pushAI(r.narration,last&&last.check);renderState(r.state);}
    else pushAI('⚠ '+(r.error||'未知错误'));}
  catch(e){pushAI('⚠ 请求失败：'+e)}setBusy(0);
}
document.getElementById('btnWait').onclick=async()=>{
  pushYou('（等待，观察世界继续运转）','do2');
  try{const r=await api('/api/game/wait',{method:'POST'}).then(x=>x.json());
    if(r.ok){pushAI(r.narration,null);renderState(r.state);}else pushAI('⚠ '+r.error);}catch(e){pushAI('⚠ '+e)}
};
async function startGame(){
  modal(true,'正在开局……（初始化裁判在工作）');
  try{const r=await api('/api/game/start',{method:'POST'}).then(x=>x.json());
    if(r.ok){modal(0);main.innerHTML='';addTurn({who:'开场 →',text:r.scene});renderState(r.state);}
    else{modal(1,'⚠ '+r.error);}}catch(e){modal(1,'⚠ '+e)}
}
document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnStop').onclick=()=>api('/api/game/stop',{method:'POST'}).then(()=>location.reload());
function applyPixelArt(r){
  const px=r.pixel||{};const hero=document.getElementById('heroSprite');
  if(px.hero&&hero){hero.src=px.hero;hero.style.display='block';hero.onerror=()=>{hero.style.display='none'};}
  window.__pixel=px;}
function applyMonsterOnFail(){
  const px=window.__pixel||{};const img=document.getElementById('heroSprite');
  if(px.monster&&img){img.src=px.monster;img.style.display='block';img.onerror=()=>{img.style.display='none'};}
}
function setBusy(on){document.getElementById('busy').style.display=on?'block':'none';
  document.getElementById('btnSend').disabled=on;}
const modal=(show,msg)=>{const m=document.getElementById('modal');if(!show){m.classList.add('hidden');return}
  m.classList.remove('hidden');document.getElementById('modalMsg').textContent=msg||'';};
refresh();
</script>
</body>
</html>
