<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldSim · 文字游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
:root{--bg:#0d1117;--panel:#161b22;--ink:#c9d1d9;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;--gold:#e3b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono","Noto Sans SC",monospace,system-ui;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid #30363d;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;color:var(--acc)}
header .spacer{flex:1}
button{background:#21262d;color:var(--ink);border:1px solid #30363d;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.5;cursor:not-allowed}
#panel{display:flex;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid #30363d;flex-wrap:wrap;font-size:13px;align-items:center}
.chip{background:#0d1117;border:1px solid #30363d;border-radius:14px;padding:3px 10px}
.chip b{color:var(--acc)}
.relgood{color:var(--ok)} .relbad{color:var(--bad)} .relneut{color:var(--dim)}
#wiChips{display:none;width:100%;padding:6px 16px 0;max-width:932px;margin:0 auto;gap:6px;flex-wrap:wrap;font-size:11px}
.wichip{background:#1a1226;border:1px solid #6e40c9;border-radius:12px;padding:2px 10px;color:#c9b8ff}
.invitem{display:inline-flex;align-items:center;gap:4px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:2px 8px 2px 2px;font-size:12px}
.invitem img{width:26px;height:26px;image-rendering:pixelated;background:#181f27;border-radius:4px;object-fit:contain}
.crewchip{display:inline-flex;align-items:center;gap:5px;background:#0d1117;border:1px solid #30363d;border-radius:14px;padding:2px 10px 2px 2px}
.crewchip img{width:30px;height:30px;image-rendering:pixelated;background:#181f27;border-radius:50%;object-fit:cover}
.mapcell{width:64px;height:64px;image-rendering:pixelated;background-size:cover;border-radius:4px;position:relative;outline:1px solid #21262d}
.mapcell .pin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.mapcell.here{outline:2px solid var(--acc)}
.hpwrap{width:140px;height:10px;background:#21262d;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
#hpbar{height:100%;background:var(--ok);width:100%;transition:width .3s,background .3s}
#hpbar.mid{background:var(--gold)} #hpbar.low{background:var(--bad)}
.xpwrap{width:90px;height:8px;background:#21262d;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
#xpbar{height:100%;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .3s}
#downBanner{display:none;width:100%;padding:8px 16px;max-width:932px;margin:6px auto 0;background:#2d1215;border:1px solid var(--bad);border-radius:8px;color:#ffb1ad;font-size:13px}
main{flex:1;overflow-y:auto;padding:18px 16px 8px;max-width:900px;width:100%;margin:0 auto}
.turn{padding:6px 12px;border-left:2px solid var(--acc);margin-bottom:14px}
.turn .who{color:var(--dim);font-size:12px;margin-bottom:2px}
.turn.you{border-left-color:#a371f7}
.turn.you .who{color:#a371f7}
.turn .dice{font-size:12px;color:var(--dim)}
.dice.ok{color:var(--ok)} .dice.fail{color:var(--bad)}
.narration{line-height:1.75;white-space:pre-wrap}
@keyframes rollIn{0%{transform:translateY(-14px) rotate(-40deg);opacity:0}60%{transform:translateY(3px) rotate(8deg);opacity:1}100%{transform:none}}
.dice.roll{animation:rollIn .5s ease-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.dice.fail{animation:shake .4s ease-in-out}
footer{padding:12px 16px;background:var(--panel);border-top:1px solid #30363d;max-width:932px;width:100%;margin:0 auto}
.modes{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.modes button.active{border-color:var(--acc);color:var(--acc);background:#0d2136}
.inputrow{display:flex;gap:8px}
#input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:var(--ink);padding:10px 12px;font:inherit;outline:none}
#input:focus{border-color:var(--acc)}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
#busy{color:var(--acc);font-size:12px;display:none}
.modal{position:fixed;inset:0;background:rgba(1,4,9,.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.modal.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>⌨ WorldSim · 文字游戏</h1>
  <span class="chip" id="worldChip">世界：—</span>
  <span class="spacer"></span>
  <button id="btnStart">▶ 开始 / 重开</button>
  <button id="btnStop">■ 结束</button>
  <button id="btnExport" title="下载 game.json 存档">💾 存档</button>
  <button id="btnImport" title="上传 game.json 覆盖当前进度">📥 读档</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  <a href="/" style="color:var(--dim);font-size:13px">← 控制台</a>
</header>
<div id="panel">
  <span class="chip">LV <b id="lv">1</b></span>
  <span class="chip">HP <span class="hpwrap"><span id="hpbar"></span></span> <b id="hp">100/100</b></span>
  <span class="chip">💰 <b id="gold">0</b></span>
  <span class="chip">⭐XP <span class="xpwrap"><span id="xpbar"></span></span> <b id="xp">0</b>/100</span>
  <span class="chip">📍 <b id="loc">—</b></span>
  <span class="chip">🎯 <b id="quest">—</b></span>
  <span class="chip">🎒 <b id="inv">—</b></span>
</div>
<div id="downBanner">⚠ 你倒下了（HP 0）——用「等待」回合回血恢复意识，或点「开始/重开」重新开始。</div>
<div id="wiChips"></div>
<div id="sceneWrap" style="width:100%;padding:6px 16px 4px;max-width:932px;margin:0 auto;display:none">
  <img id="sceneBanner" src="" style="width:100%;height:96px;object-fit:cover;object-position:center 30%;image-rendering:pixelated;border:1px solid #30363d;border-radius:8px;display:block" alt="">
</div>
<div style="width:100%;padding:0 16px 6px;max-width:932px;margin:0 auto;display:flex;align-items:flex-end;gap:10px"><img id="heroSprite" src="" style="height:64px;image-rendering:pixelated;display:none" alt=""><div id="crew" style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px"></div></div>
<div id="attrs" style="width:100%;padding:0 16px 6px;max-width:932px;margin:0 auto;font-size:12px;color:var(--dim);max-height:88px;overflow-y:auto"></div>
<div id="invGrid" style="width:100%;padding:0 16px 6px;max-width:932px;margin:0 auto;display:none;flex-wrap:wrap;gap:6px"></div>
<details id="mapWrap" style="width:100%;max-width:932px;margin:0 auto 8px;padding:0 16px"><summary style="font-size:12px;color:var(--dim);cursor:pointer">🗺 世界地图（确定性布局 · tile 渲染）</summary><div id="mapGrid" style="display:grid;gap:2px;margin-top:6px"></div></details>
<main id="log"></main>
<footer>
  <div class="modes">
    <button class="modebtn active" data-m="do" title="第三人称行动描述">▸ 行动 do</button>
    <button class="modebtn" data-m="say" title="第一人称说话（引号内内容直接出声）">💬 说话 say</button>
    <button class="modebtn" data-m="story" title="以世界意志推进剧情（作者模式）">✍ 叙事 story</button>
    <button id="btnWait" class="hint" title="世界自转 + 休息回血（引擎日推进一天）">⏳ 等待</button>
    <button id="btnUndo" class="hint" title="撤销最近一步：数值/背包/好感全部回滚到该回合前">↩ 撤销上一步</button>
  </div>
  <div class="inputrow">
    <input id="input" placeholder="输入你要做的事，回车提交（掷骰由代码完成——命运在骰子上）…">
    <button id="btnSend">⏎</button>
  </div>
  <div class="hint" id="busy">裁决中……（骰子+叙述需要两次 LLM 调用）</div>
</footer>
<div class="modal hidden" id="modal"><div id="modalMsg" style="color:var(--acc)">正在开局……</div></div>

<script>
const $=s=>document.querySelector(s);const main=document.getElementById('log');let mode='do';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const api=(p,opt)=>fetch(p,Object.assign({headers:{'Content-Type':'application/json'}},opt||{})).then(r=>r.json().catch(()=>({ok:false,error:'非 JSON 响应'})));
const post=(p,body)=>api(p,{method:'POST',body:JSON.stringify(body||{})});
let gameOn=false;let hist=[];let histIdx=-1;let busyOn=false;

function setBusy(on){busyOn=on;
  $('#busy').style.display=on?'block':'none';
  $('#btnSend').disabled=on;$('#btnWait').disabled=on;$('#btnUndo').disabled=on;$('#btnStart').disabled=on;}

function renderCrew(portraits){
  const c=$('#crew');c.innerHTML='';
  (portraits||[]).forEach(p=>{
    const rel=(p.relation!=null)?`<span class="${p.relation>0?'relgood':p.relation<0?'relbad':'relneut'}">${p.relation>0?'+':''}${p.relation}</span>`:'';
    c.insertAdjacentHTML('beforeend',`<span class="crewchip">${p.img?`<img src="${esc(p.img)}" alt="">`:''}${esc(p.name)} ${rel}</span>`);
  });
}
function renderInv(items,icons){
  const g=$('#invGrid');g.innerHTML='';
  const list=(icons&&icons.length?icons:(items||[]).map(n=>({name:n})));
  list.forEach(it=>{
    g.insertAdjacentHTML('beforeend',`<span class="invitem">${it.img?`<img src="${esc(it.img)}" alt="">`:''}${esc(it.name)}</span>`);
  });
  g.style.display=list.length?'flex':'none';
}
function renderMap(map){
  const w=$('#mapWrap'),g=$('#mapGrid');
  if(!map||!map.cells||!map.cells.length){w.style.display='none';return;}
  w.style.display='block';g.innerHTML='';
  g.style.gridTemplateColumns=`repeat(${map.side},64px)`;
  const hero=map.hero||{x:0,y:0};
  map.cells.forEach(c=>{
    const here=c.x===hero.x&&c.y===hero.y;
    const cls='mapcell'+(here?' here':'');
    const pin=here?'<span class="pin">🧍</span>':'';
    g.insertAdjacentHTML('beforeend',`<div class="${cls}" style="background-image:url('${esc(map.base||'/art/')}tile-${c.tile}.png');background-color:#181f27" title="${esc(c.name)}">${pin}</div>`);
  });
}
function renderWi(hits){
  const w=$('#wiChips');
  if(!hits||!hits.length){w.style.display='none';return;}
  w.style.display='flex';
  w.innerHTML=hits.map(k=>`<span class="wichip">🔎 ${esc(k)}</span>`).join('');
}
function renderState(st){
  if(!st)return;
  $('#lv').textContent=st.level;
  $('#hp').textContent=st.hp+'/'+st.max_hp;
  const pct=Math.max(0,100*st.hp/Math.max(1,st.max_hp));
  const bar=$('#hpbar');bar.style.width=pct+'%';
  bar.className=pct<=25?'low':pct<=55?'mid':'';
  $('#gold').textContent=st.gold;
  $('#xpbar').style.width=Math.min(100,st.xp)+'%';
  $('#xp').textContent=st.xp;
  $('#loc').textContent=st.location||'—';
  $('#quest').textContent=st.quest||'—';
  $('#inv').textContent=(st.inventory||[]).length?st.inventory.slice(0,4).join('、')+(st.inventory.length>4?'…':''):'（空）';
  $('#downBanner').style.display=st.downed?'block':'none';
  const at=$('#attrs');at.innerHTML='';
  if(st.attrs)for(const[k,v]of Object.entries(st.attrs)){
    at.insertAdjacentHTML('beforeend',`<span class="chip">${esc(k)} <b>${v}</b>/10</span> `);
  }
  if(st.relations)for(const[n,r]of Object.entries(st.relations)){
    at.insertAdjacentHTML('beforeend',`<span class="chip">❤ ${esc(n)} <b class="${r>0?'relgood':r<0?'relbad':''}">${r>0?'+':''}${r}</b></span> `);
  }
}
function addTurn(t,animate){
  const div=document.createElement('div');div.className='turn'+(t.you?' you':'');
  div.innerHTML=`<div class="who">${esc(t.who)}</div><div class="narration">${esc(t.text)}</div>`;
  if(t.check){const c=t.check,ok=c.success;
    div.insertAdjacentHTML('beforeend',`<div class="dice ${ok?'ok':'fail'}${animate?' roll':''}">🎲 检定[${esc(c.ability)}]: d20=${c.roll}${(c.mod>=0?'+':'')+c.mod} vs 难度${c.dc} → ${ok?'成功':'失败'}</div>`);}
  main.appendChild(div);main.scrollTop=main.scrollHeight;
}
function pushYou(txt,m){addTurn({you:1,who:`你 (${mName(m)}) →`,text:txt});}
function pushAI(txt,chk){addTurn({who:'世界 →',text:txt,check:chk});}
const mName=m=>({do:'行动',say:'说话',story:'叙事',wait:'等待'})[m]||'行动';

function applyView(r){
  $('#worldChip').textContent='世界：'+(r.world||'—')+(r.day!=null?' · Day '+r.day:'');
  const sw=$('#sceneWrap'),sb=$('#sceneBanner');
  if(r.scene){sw.style.display='block';sb.src=r.scene;}else{sw.style.display='none';}
  renderWi(r.wi_hits);
  renderCrew(r.portraits);
  renderMap(r.map);
  if(r.game){
    renderState(r.game);
    renderInv(r.game.inventory,r.item_icons);
    gameOn=!!r.game.enabled;
  }
}
async function refresh(){try{const r=await api('/api/game/status');
  if(r.error||!r.game)return;
  const px=r.pixel||{};
  if(px.hero){const hero=$('#heroSprite');hero.src=px.hero;hero.style.display='block';hero.onerror=()=>{hero.style.display='none'};}
  applyView(r);
  if(!r.game.log)return;
  main.innerHTML='';
  for(const e of r.game.log){
    if(e.mode==='start'){addTurn({who:'开场 →',text:e.narration});}
    else{pushYou(e.input,e.mode);pushAI(e.narration,e.check);}
  }
}catch(e){}}

document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll('.modebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
$('#btnSend').onclick=send;
$('#input').addEventListener('keydown',e=>{
  if(e.key==='Enter')send();
  else if(e.key==='ArrowUp'){if(histIdx<hist.length-1){histIdx++;$('#input').value=hist[hist.length-1-histIdx]||'';}e.preventDefault();}
  else if(e.key==='ArrowDown'){if(histIdx>0){histIdx--;$('#input').value=hist[hist.length-1-histIdx]||'';}else{histIdx=-1;$('#input').value='';}e.preventDefault();}
});
async function send(){
  const inp=$('#input');const txt=inp.value.trim();if(!txt||busyOn)return;inp.value='';histIdx=-1;
  hist.push(txt);if(hist.length>30)hist.shift();
  pushYou(txt,mode);setBusy(true);
  try{const r=await post('/api/game/action',{input:txt,mode});
    if(r.ok){
      const last=((r.state||{}).log||[]).slice(-1)[0];
      pushAI(r.narration,last&&last.check);
      renderState(r.state);renderInv(r.state.inventory,null);
      const fresh=await api('/api/game/status');
      if(fresh&&fresh.ok)applyView(fresh);
    }
    else pushAI('⚠ '+(r.error||'未知错误'));
  }catch(e){pushAI('⚠ 请求失败：'+e)}
  setBusy(false);
}
$('#btnWait').onclick=async()=>{
  if(busyOn)return;setBusy(true);
  pushYou('（等待，观察世界继续运转）','wait');
  try{const r=await post('/api/game/wait');
    if(r.ok){pushAI(r.narration,null);renderState(r.state);
      const fresh=await api('/api/game/status');if(fresh&&fresh.ok)applyView(fresh);}
    else pushAI('⚠ '+r.error);}catch(e){pushAI('⚠ '+e)}
  setBusy(false);
};
$('#btnUndo').onclick=async()=>{
  if(busyOn)return;setBusy(true);
  try{const r=await post('/api/game/undo');
    if(r.ok){pushAI('↩ 已撤销上一步（状态回滚到该回合前）',null);await refresh();}
    else pushAI('⚠ '+r.error);}catch(e){pushAI('⚠ '+e)}
  setBusy(false);
};
$('#btnExport').onclick=()=>{window.location.href='/api/game/export';};
$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async()=>{
  const f=$('#importFile').files[0];if(!f)return;
  setBusy(true);
  try{
    const data=await f.text();
    const r=await post('/api/game/import',JSON.parse(data));
    if(r.ok){pushAI('📥 存档已导入',null);await refresh();}
    else pushAI('⚠ '+r.error);
  }catch(e){pushAI('⚠ 读档失败：'+e)}
  $('#importFile').value='';setBusy(false);
};
async function startGame(){
  if(gameOn&&!confirm('重开将清空当前进度（可先「存档」备份），确定？'))return;
  modal(true,'正在开局……（初始化裁判在工作）');
  try{const r=await post('/api/game/start');
    if(r.ok){modal(false);main.innerHTML='';addTurn({who:'开场 →',text:r.scene});renderState(r.state);await refresh();}
    else{modal(true,'⚠ '+r.error);}}catch(e){modal(true,'⚠ '+e)}
}
$('#btnStart').onclick=startGame;
$('#btnStop').onclick=async()=>{await post('/api/game/stop');location.reload();};
const modal=(show,msg)=>{const m=$('#modal');if(!show){m.classList.add('hidden');return}
  m.classList.remove('hidden');$('#modalMsg').textContent=msg||'';};
refresh();
</script>
</body>
</html>
