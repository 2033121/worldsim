# WorldSim Docker Compose — 一键部署
# 启动：docker compose up -d --build
# 停止：docker compose down
# 查看日志：docker compose logs -f
services:
  worldsim:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldsim:local
    container_name: worldsim
    restart: unless-stopped
    ports:
      - "48092:48092"   # 统一前端入口（浏览器式导航外壳 + API 网关）
      - "48091:48091"   # 世界模拟 WebUI
      - "48090:48090"   # 小说创作服务
    volumes:
      # 数据目录（api.json / worlds / worldbooks / storys 全在这里）
      - ./wsdata:/app/wsdata
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:48091/api/worlds"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 联网搜索后端（SearXNG 自托管）——worldsim 的 web_search 工具通过容器内 http://searxng:8080 调用
  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"   # 宿主机访问 http://localhost:8888
    volumes:
      - ./wsdata/searxng:/etc/searxng
    environment:
      - TZ=Asia/Shanghai
