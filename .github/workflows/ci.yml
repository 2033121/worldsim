name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Format check
        run: |
          gofmt -l . | grep -v '^$' && exit 1 || echo "gofmt: clean"
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  mcp-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MCP server 语法检查
        run: python3 -m py_compile worldsim-mcp/server.py && echo "MCP syntax OK"
      - name: MCP 协议自检（mock initialize + tools/list）
        run: |
          printf '%s\n%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | python3 worldsim-mcp/server.py | python3 -c "import json,sys; rs=[json.loads(l) for l in sys.stdin if l.strip()]; assert any(r.get('id')==1 and 'serverInfo' in r.get('result',{}) for r in rs); tl=[r for r in rs if r.get('id')==2][0]['result']['tools']; assert len(tl)>=20; print('MCP: protocol OK, tools:', len(tl))"