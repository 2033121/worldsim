name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-compile all platforms
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            exe=""
            [ "$os" = "windows" ] && exe=".exe"
            echo "==> building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "dist/worldsim-$os-$arch$exe" .
          done

      - name: Package
        run: |
          cd dist
          mkdir -p pkg
          for bin in worldsim-*; do
            os_arch=${bin#worldsim-}
            os=${os_arch%%-*}; arch=${os_arch#*-}; arch=${arch%.exe}
            dir="pkg/worldsim-$os-$arch"
            mkdir -p "$dir/wsdata/worldbooks"
            cp "$bin" "$dir/worldsim$([ "$os" = windows ] && echo .exe)"
            cp ../README.md ../LICENSE "$dir/"
            cp ../scripts/run.sh "$dir/" 2>/dev/null || true
            cp ../scripts/run.bat "$dir/" 2>/dev/null || true
            # 世界书模板 + LLM配置模板
            if [ -d ../worldbooks ]; then cp -r ../worldbooks/* "$dir/wsdata/worldbooks/" 2>/dev/null || true; fi
            printf '{\n  "api_key": "YOUR_API_KEY",\n  "base_url": "https://your-api-endpoint/v1",\n  "model": "your-model"\n}\n' > "$dir/wsdata/api.json.example"
            if [ "$os" = windows ]; then
              zip_base=${os_arch%.exe}
              python3 -c "import shutil; shutil.make_archive('$zip_base','zip','pkg','worldsim-$os-$arch')" 2>/dev/null || (cd pkg && zip -r "$zip_base.zip" "worldsim-$os-$arch")
            else
              tar czf "$os_arch.tar.gz" -C pkg "worldsim-$os-$arch"
            fi
            rm -rf "$dir"
          done
          ls -la

      - name: Build plugin binary (linux/arm64)
        run: |
          mkdir -p dist/pluginbin
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/pluginbin/worldsim .

      - name: Assemble Operit plugin + MCP
        run: |
          cd dist
          mkdir -p plugin/wsdata/worldbooks plugin/wsdata/material
          cp pluginbin/worldsim plugin/worldsim
          cp ../scripts/run.sh plugin/run.sh
          cp ../operit-plugin/worldsim.js ../operit-plugin/SKILL.md ../operit-plugin/TESTING.md ../operit-plugin/README.md plugin/
          cp -r ../worldbooks/* plugin/wsdata/worldbooks/
          cp -r ../material/* plugin/wsdata/material/
          printf '{\n  "api_key": "YOUR_API_KEY",\n  "base_url": "https://your-api-endpoint/v1",\n  "model": "your-model"\n}\n' > plugin/wsdata/api.json.example
          zip -r "worldsim_plugin_${{ github.ref_name }}.zip" plugin
          rm -rf plugin pluginbin
          mkdir mcp
          cp -r ../worldsim-mcp mcp/
          cp ../AGENTS.md mcp/
          (cd mcp && zip -r "../worldsim-mcp-${{ github.ref_name }}.zip" .)
          rm -rf mcp
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true